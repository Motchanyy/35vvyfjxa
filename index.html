<body>

<div class="editor-container">
    <!-- ЛІВА ПАНЕЛЬ -->
    <div class="settings-panel">
        <h2><i class="ion-android-options"></i> Налаштування віджета</h2>

        <div class="form-group">
            <label>Назва віджета (Site ID)</label>
            <input type="text" id="widgetName" class="form-control" value="my-shop-123">
        </div>

        <div class="form-group">
            <label>Основний колір</label>
            <div class="color-picker-wrapper"><div id="colorPicker"></div></div>
        </div>

        <div class="form-group">
            <label>Колір тексту/іконки</label>
            <div class="color-picker-wrapper"><div id="textColorPicker"></div></div>
        </div>

        <div class="form-group">
            <label>Позиція на екрані</label>
            <select id="positionSelect" class="form-control">
                <option value="bottom-right">Нижній правий кут</option>
                <option value="bottom-left">Нижній лівий кут</option>
                <option value="top-right">Верхній правий кут</option>
                <option value="top-left">Верхній лівий кут</option>
            </select>
        </div>

        <div class="form-group">
            <label>Тип анімації</label>
            <select id="animationSelect" class="form-control">
                <option value="zoom">Zoom in</option>
                <option value="slide">Slide in</option>
                <option value="spring">Slide in (spring)</option>
                <option value="fountain">Fountain</option>
            </select>
        </div>

        <div class="form-group">
            <label>Відступи (X / Y)</label>
            <div style="display:flex; gap:10px;">
                <input type="number" id="offsetX" class="form-control" value="25" min="0">
                <input type="number" id="offsetY" class="form-control" value="25" min="0">
            </div>
        </div>

        <hr>

        <div class="form-group">
            <label>Головна іконка</label>
            <div class="icon-selector" onclick="toggleIconPicker('mainIconPicker')">
                <div class="icon-preview">
                    <i id="currentMainIcon" class="ion-plus-round"></i>
                    <span>Змінити іконку</span>
                </div>
                <div id="mainIconPicker" class="icon-dropdown"></div>
            </div>
        </div>

        <div class="form-group">
            <label>Додаткові кнопки (Меню)</label>
            <div class="buttons-list" id="buttonsList"></div>
            <button class="btn btn-primary" style="margin-top:10px; width:100%" onclick="addNewButton()">+ Додати кнопку</button>
        </div>

        <button class="btn btn-success" onclick="generateCode()"><i class="ion-code"></i> Зберегти та отримати код</button>
    </div>

    <!-- ПРАВА ПАНЕЛЬ -->
    <div class="preview-panel">
        <div class="mock-site">
            <div class="mock-header">Сайт Клієнта (Demo)</div>
            <div class="mock-content">
                <h1>Ласкаво просимо!</h1>
                <p>Наведіть на кнопку віджета, щоб побачити розкриття меню.</p>
                <p>Змінюйте колір, позицію, анімацію або додавайте кнопки зліва.</p>
            </div>

            <!-- КОРІНЬ ВІДЖЕТА MFB (клас позиції+анімації і вміст генерує JS) -->
            <ul id="menu" data-mfb-toggle="hover"></ul>
        </div>
    </div>
</div>

<!-- МОДАЛЬНЕ ВІКНО КОДУ -->
<div class="code-modal" id="codeModal">
    <div class="code-content">
        <h3>Код для вставки на сайт</h3>
        <p>Скопіюйте цей код та вставте перед закриваючим тегом <code>&lt;/body&gt;</code>.</p>
        <textarea id="generatedCodeArea" readonly></textarea>
        <div style="text-align:right;">
            <button class="btn" onclick="document.getElementById('codeModal').style.display='none'">Закрити</button>
            <button class="btn btn-primary" onclick="copyCode()">Копіювати</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
<script>
    // --- СТАН ---
    let config = {
        primaryColor: '#007bff',
        textColor: '#ffffff',
        position: 'bottom-right',
        animation: 'zoom',
        offsetX: 25,
        offsetY: 25,
        mainIcon: 'ion-plus-round',
        buttons: [
            { icon:'ion-social-whatsapp', link:'https://wa.me/1234567890', label:'WhatsApp', color:'#25D366', iconColor:'#ffffff' },
            { icon:'ion-paper-airplane',  link:'https://t.me/username',    label:'Telegram', color:'#0088cc', iconColor:'#ffffff' }
        ]
    };

    // мапінг у справжні класи MFB
    const POS_CLASS = { 'bottom-right':'mfb-component--br', 'bottom-left':'mfb-component--bl', 'top-right':'mfb-component--tr', 'top-left':'mfb-component--tl' };
    const FX_CLASS  = { 'zoom':'mfb-zoomin', 'slide':'mfb-slidein', 'spring':'mfb-slidein-spring', 'fountain':'mfb-fountain' };

    const menu = document.getElementById('menu');
    let buttonPickrs = [];
    const SWATCHES = ['#007bff','#28a745','#dc3545','#ffc107','#17a2b8','#6f42c1','#25D366','#0088cc','#ffffff','#333333'];

    // набір ionicons для вибору
    const iconsList = [
        'ion-plus-round','ion-chatbubbles','ion-chatbox-working','ion-headphone','ion-person','ion-email',
        'ion-ios-telephone','ion-social-whatsapp','ion-paper-airplane','ion-social-facebook','ion-ios-cart',
        'ion-help-circled','ion-information-circled','ion-ios-star','ion-ios-heart','ion-location'
    ];

    // --- PICKR (глобальні кольори) ---
    const initPickr = (elementId, defaultColor, callback) => Pickr.create({
        el: elementId, theme:'nano', default:defaultColor, swatches:SWATCHES,
        components:{ preview:true, opacity:true, hue:true, interaction:{ input:true, save:false } }
    }).on('change', color => callback(color.toHEXA().toString()));

    initPickr('#colorPicker', config.primaryColor, c => { config.primaryColor = c; buildInner(); });
    initPickr('#textColorPicker', config.textColor, c => { config.textColor = c; buildInner(); });

    function createInlinePickr(el, defaultColor, onChange) {
        return Pickr.create({
            el: el, theme:'nano', default:defaultColor || '#ffffff', swatches:SWATCHES,
            components:{ preview:true, opacity:true, hue:true, interaction:{ input:true, save:false } }
        }).on('change', color => onChange(color.toHEXA().toString()));
    }

    // --- РЕНДЕР ВІДЖЕТА (справжня структура MFB) ---
    function buildInner() {
        let childrenHtml = '';
        config.buttons.forEach(btn => {
            const bg = btn.color || config.primaryColor;
            const ic = btn.iconColor || config.textColor;
            childrenHtml += `
                <li>
                    <a href="${btn.link}" data-mfb-label="${(btn.label||'').replace(/"/g,'&quot;')}" class="mfb-component__button--child" style="background-color:${bg}; color:${ic};">
                        <i class="mfb-component__child-icon ${btn.icon}"></i>
                    </a>
                </li>`;
        });

        menu.innerHTML = `
            <li class="mfb-component__wrap">
                <a href="#" class="mfb-component__button--main" style="background-color:${config.primaryColor}; color:${config.textColor};">
                    <i class="mfb-component__main-icon--resting ${config.mainIcon}"></i>
                    <i class="mfb-component__main-icon--active ion-close-round"></i>
                </a>
                <ul class="mfb-component__list">${childrenHtml}</ul>
            </li>`;

        applyClass();
    }

    function applyClass() {
        menu.className = POS_CLASS[config.position] + ' ' + FX_CLASS[config.animation];
        menu.style.margin = config.offsetY + 'px ' + config.offsetX + 'px';
    }

    // Перезапуск появи кнопки — прийом з демо MFB (display none -> block)
    function renderMenu() {
        menu.style.display = 'none';
        setTimeout(function(){ menu.style.display = 'block'; applyClass(); }, 1);
    }

    // --- СПИСОК КНОПОК ---
    function addNewButton() {
        config.buttons.push({ icon:'ion-link', link:'https://example.com', label:'Кнопка', color:config.primaryColor, iconColor:config.textColor });
        renderButtonsListEditor();
        buildInner();
    }
    function removeButton(index) {
        config.buttons.splice(index, 1);
        renderButtonsListEditor();
        buildInner();
    }

    function renderButtonsListEditor() {
        buttonPickrs.forEach(p => { try { p.destroyAndRemove(); } catch(e){} });
        buttonPickrs = [];

        const list = document.getElementById('buttonsList');
        list.innerHTML = '';

        config.buttons.forEach((btn, index) => {
            const item = document.createElement('div');
            item.className = 'button-item';
            item.innerHTML = `
                <div class="bi-top">
                    <div class="bi-icon" title="Змінити іконку"><i class="${btn.icon}"></i></div>
                    <input type="text" class="form-control bi-link" value="${btn.link}" placeholder="Посилання">
                    <i class="ion-trash-a btn-remove" title="Видалити"></i>
                </div>
                <input type="text" class="form-control" style="margin-top:6px" value="${(btn.label||'').replace(/"/g,'&quot;')}" placeholder="Підпис (label)">
                <div class="bi-icons-dropdown"></div>
                <div class="bi-colors">
                    <span class="bi-clabel">Фон</span><div class="bi-pickr-bg"></div>
                    <span class="bi-clabel">Іконка</span><div class="bi-pickr-ic"></div>
                </div>`;
            list.appendChild(item);

            item.querySelector('.bi-link').addEventListener('change', e => { config.buttons[index].link = e.target.value; buildInner(); });
            item.querySelectorAll('input')[1].addEventListener('input', e => { config.buttons[index].label = e.target.value; buildInner(); });
            item.querySelector('.btn-remove').addEventListener('click', () => removeButton(index));

            const iconBox = item.querySelector('.bi-icon');
            const dd = item.querySelector('.bi-icons-dropdown');
            iconBox.addEventListener('click', () => dd.classList.toggle('active'));
            iconsList.forEach(ic => {
                const opt = document.createElement('div');
                opt.className = 'icon-option';
                opt.innerHTML = `<i class="${ic}"></i>`;
                opt.onclick = () => { config.buttons[index].icon = ic; renderButtonsListEditor(); buildInner(); };
                dd.appendChild(opt);
            });

            buttonPickrs.push(createInlinePickr(item.querySelector('.bi-pickr-bg'), btn.color || config.primaryColor,
                val => { config.buttons[index].color = val; buildInner(); }));
            buttonPickrs.push(createInlinePickr(item.querySelector('.bi-pickr-ic'), btn.iconColor || config.textColor,
                val => { config.buttons[index].iconColor = val; buildInner(); }));
        });
    }

    // --- ГОЛОВНА ІКОНКА ---
    function initIconPicker() {
        const container = document.getElementById('mainIconPicker');
        iconsList.forEach(ic => {
            const div = document.createElement('div');
            div.className = 'icon-option';
            div.innerHTML = `<i class="${ic}"></i>`;
            div.onclick = () => {
                config.mainIcon = ic;
                document.getElementById('currentMainIcon').className = ic;
                toggleIconPicker('mainIconPicker');
                buildInner();
            };
            container.appendChild(div);
        });
    }
    function toggleIconPicker(id) { document.getElementById(id).classList.toggle('active'); }

    // --- СЛУХАЧІ ---
    document.getElementById('positionSelect').addEventListener('change', e => { config.position = e.target.value; renderMenu(); });
    document.getElementById('animationSelect').addEventListener('change', e => { config.animation = e.target.value; renderMenu(); });
    document.getElementById('offsetX').addEventListener('input', e => { config.offsetX = e.target.value; applyClass(); });
    document.getElementById('offsetY').addEventListener('input', e => { config.offsetY = e.target.value; applyClass(); });

    // --- ГЕНЕРАЦІЯ КОДУ ---
    function generateCode() {
        const siteId = document.getElementById('widgetName').value.replace(/\s+/g, '-').toLowerCase();
        const jsonConfig = JSON.stringify({
            primaryColor: config.primaryColor, textColor: config.textColor,
            position: config.position, animation: config.animation,
            offsetX: config.offsetX, offsetY: config.offsetY,
            mainIcon: config.mainIcon, buttons: config.buttons
        });
        const code = `
<!-- GrowthContour Chat Widget -->
<script>
    window.GCWidgetConfig = window.GCWidgetConfig || {};
    window.GCWidgetConfig['${siteId}'] = ${jsonConfig};

    (function(w,d,s,u){
        var js = d.createElement(s); js.async = true; js.src = u;
        var first = d.getElementsByTagName(s)[0];
        first.parentNode.insertBefore(js, first);
    })(window, document, 'script', 'https://demo.growthcontour.com/chat/widget.js');
<\/script>
<!-- End GrowthContour Chat Widget -->`.trim();

        document.getElementById('generatedCodeArea').value = code;
        document.getElementById('codeModal').style.display = 'flex';
    }
    function copyCode() {
        const t = document.getElementById('generatedCodeArea');
        t.select(); document.execCommand('copy'); alert('Код скопійовано!');
    }

    // --- ЗАПУСК ---
    initIconPicker();
    renderButtonsListEditor();
    buildInner();
    renderMenu();
</script>

</body>
</html>
